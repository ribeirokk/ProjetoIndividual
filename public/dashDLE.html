  <div id="popup" class="popup" style="display: none;">
    <div class="popup-content">
      <h2 id="popup-msg"></h2>
      <button onclick="fecharPopup()">OK</button>
    </div>


    <!--footer fim-->

    <script>

      PartidasJogadas();
      PartidasGanhas();
      Aproveitamento();

      function voltarHome() {
        window.location.href = "index.html";
      }

      function voltarDashboard() {
        window.location.href = "skyrimdle.html";
      };

      function abrirPopup(msg) {
        document.getElementById("popup-msg").innerHTML = msg;
        document.getElementById("popup").style.display = "flex";
      };

      function fecharPopup() {
        document.getElementById("popup").style.display = "none";
      };

      nome_usuario.innerText = sessionStorage.getItem("NOME_USUARIO");


      function PartidasJogadas() {
        fetch(`/partida/partidasJogadas/${sessionStorage.ID_USUARIO}`)
          .then(res => res.json())
          .then(dados => {
            p_partidasJogadas.innerHTML = dados.partidasJogadas;
          });
      }

      function PartidasGanhas() {
        fetch(`/partida/partidasGanhas/${sessionStorage.ID_USUARIO}`)
          .then(res => res.json())
          .then(dados => {
            p_partidasGanhas.innerHTML = dados.partidasGanhas;
          });
      }

      function Aproveitamento() {
        fetch(`/partida/aproveitamento/${sessionStorage.ID_USUARIO}`)
          .then(res => res.json())
          .then(dados => {
            p_aproveitamento.innerHTML = dados.aproveitamento + "%";
          });
      }

      function obterDadosGrafico() {
        var fkUsuario = sessionStorage.ID_USUARIO;

        fetch(`/partida/obterDadosGrafico/${fkUsuario}`)
          .then(response => response.json())
          .then(function (response) {
            console.log('to dentro do grafico', response)

            console.log(`Dados recebidos: ${JSON.stringify(response)}`);

            plotarGrafico(response);

          })
          .catch(function (error) {
            console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
          });
      }



      function plotarGrafico(resultado) {
        console.log(resultado)
        resultado.reverse();
        var labels = [];
        var tentativas = [];

        for (var i = 0; i < resultado.length; i++) {
          labels.push(`Partida ${labels.length + 1}`);
          tentativas.push(resultado[i].tentativasUsadas);
        }

        var dados = {
          labels: labels,
          datasets: [{
            label: 'Tentativas',
            data: tentativas,
            backgroundColor: 'darkred'
          }]
        };

        const ctx = document.getElementById('graficoTentativasPartida');

        const config = {
          type: 'bar',
          data: dados,
          options: {
            animation: false,
            plugins: {
              legend: {
                labels: {
                  color: '#ffff'
                }
              }
            },
            scales: {
              x: {
                ticks: {
                  color: '#ffff'
                }
              },
              y: {
                ticks: {
                  color: '#ffff'
                }
              }
            }
          }
        };

        var myChart = new Chart(ctx, config);
      }

      function vitoriaDerrota() {
        const id = sessionStorage.ID_USUARIO;

        fetch(`/partida/partidasJogadas/${id}`)
          .then(res => res.json())
          .then(dadosJogadas => {

            const totalJogadas = dadosJogadas.partidasJogadas;

            fetch(`/partida/partidasGanhas/${id}`)
              .then(res => res.json())
              .then(dadosGanhas => {

                const totalGanhas = dadosGanhas.partidasGanhas;
                const totalDerrotas = totalJogadas - totalGanhas;

                plotarPizza(totalGanhas, totalDerrotas);

              });

          })
          .catch(err => console.error("Erro no gráfico de pizza:", err));
      }
      window.onload = () => {
        obterDadosGrafico();
        vitoriaDerrota();
      };

      function plotarPizza(vitorias, derrotas) {
        const ctx = document.getElementById('grafico_vitoriaderrota');

        new Chart(ctx, {
          type: 'pie',
          data: {
            labels: ['Vitórias  ', 'Derrotas'],
            datasets: [{
              data: [vitorias, derrotas],
              backgroundColor: ['white', 'black']
            }]
          },
          options: {
            plugins: {
              legend: {
                labels: { color: '#fff' }
              }
            }
          }
        });
      }

      function dashDLE() {
        window.location.href = "dashDLE.html";
      }

      function dashMundo() {
        window.location.href = "dash.html";
      }

      const raca = sessionStorage.RACA_USUARIO;
      document.getElementById("img_raca").src = `../assets/img/cadastro/${raca}.jpg`;

    </script>
